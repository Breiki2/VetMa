doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
    orm:
        entity_managers:
            default:
                auto_mapping: true
                mappings:
                    App:
                        type: attribute
                        is_bundle: false
                        dir: '%kernel.project_dir%/src/Entity'
                        prefix: 'App\Entity'
                        alias: App
